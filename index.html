<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Fee Management System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="card">
            <div class="card-body">
                <div class="text-center mb-3">
    <i class="bi bi-mortarboard-fill logo-icon"></i>
</div>
            <h2 class="text-center mb-3">Student Fee Management System</h2>
            <p class="text-center text-muted mb-4">Please login to continue</p>
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email">
            <label class="form-label mt-3">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password">
            <label class="form-label mt-3">Role</label>

<select class="form-select">
    <option selected>Select Role</option>
    <option>Admin</option>
    <option>User</option>
</select>
<div class="d-grid mt-4">
    <button type="submit" class="btn btn-login">Login</button>
</div>
<div class="text-end mt-2">
    <a href="#" class="forgot-link">Forgot Password?</a>
</div>
        </div>
        </div>
        </div>
        </div>
        
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

</body>

</html>
