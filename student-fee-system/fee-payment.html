<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Fee Management System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-lg-2">

            <div class="sidebar">

                <div class="text-center py-4">
                    <i class="bi bi-mortarboard-fill logo-icon"></i>

                    <h5 class="text-white mt-2">
                        Student Fee<br>Management System
                    </h5>
                </div>

                <a href="admin-dashboard.html" class="menu-item">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>

                <a href="students.html" class="menu-item">
                    <i class="bi bi-people-fill"></i> Students
                </a>

                <a href="fee-payment.html" class="menu-item active">
                    <i class="bi bi-credit-card-fill"></i> Fee Payment
                </a>

                <a href="receipts.html" class="menu-item">
                    <i class="bi bi-receipt"></i> Receipts
                </a>

                <a href="reports.html" class="menu-item">
                    <i class="bi bi-bar-chart-fill"></i> Reports
                </a>

                <a href="#" class="menu-item">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>

            </div>

        </div>

        <div class="col-lg-10">

            <div class="p-4">

                <div class="topbar">

                    <h3>Fee Payment</h3>

                    <div class="admin-info">
                        <i class="bi bi-person-circle"></i>
                        <span>Admin</span>
                    </div>

                </div>

                <p class="text-muted">
                    Record and manage student fee payments quickly and securely.
                </p>

                <div class="card mt-4">

                    <div class="card-body">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Student ID</label>
                                <input type="text" class="form-control" placeholder="Enter Student ID">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Student Name</label>
                                <input type="text" class="form-control" placeholder="Enter Student Name">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <select class="form-select">
                                    <option>CSE</option>
                                    <option>EEE</option>
                                    <option>BBA</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Semester</label>
                                <select class="form-select">
                                    <option>1st</option>
                                    <option>2nd</option>
                                    <option>3rd</option>
                                    <option>4th</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Payment Month</label>
                                <input type="month" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" class="form-control" placeholder="Enter Amount">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Payment Method</label>
                                <select class="form-select">
                                    <option>Cash</option>
                                    <option>bKash</option>
                                    <option>Nagad</option>
                                    <option>Bank Transfer</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Transaction ID</label>
                                <input type="text" class="form-control" placeholder="Enter Transaction ID">
                            </div>

                        </div>

                        <button class="btn btn-login mt-3">
                            <i class="bi bi-cash-coin"></i> Pay Fee
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/script.js"></script>

</body>
</html>
